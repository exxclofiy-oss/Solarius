name: Build Solarius Final
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@v4
      - name: Install Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Validate custom models and resource pack
        run: python3 tests/validate_assets.py
      - name: Build Paper plugin
        run: mvn -B --no-transfer-progress clean package
      - name: Downloadable plugin and matching resource pack
        uses: actions/upload-artifact@v4
        with:
          name: Solarius-INSTALL-THIS
          path: |
            target/Solarius-4.0.0.jar
            Solarius-ResourcePack-1.21.11.zip
          if-no-files-found: error
